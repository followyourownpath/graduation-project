          required: true
          type: string
      tags:
        - Fetch an opportunity by id
      responses:
        200:
          description: The opportunities resource
          schema:
            $ref: '#/definitions/Opportunity'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        401:

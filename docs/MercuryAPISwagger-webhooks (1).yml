  /{token}/contacts:
    get:
      summary: Search for contacts
      description: |
       Search for contacts based on various criteria. If no optional query params are passed, it will return the 25 most recently created records in descending order
      operationId: Contact-search
      parameters:
        - name: token
          in: path
          required: true
          description: User security token
          x-ms-summary: User security token
          type: string
          x-ms-visibility: internal
        - name: x-api-key
          in: header
          description: API key for the broker group
          x-ms-summary: API key
          required: true
          type: string
        - name: search
          in: query
          required: true
          description: Marker param to let the system know a search is being requested.  The param name can be passed by itself.
                     eg. both /contacts?search and /contacts?search=true will have the same effect
          type: string
          default: true
          x-ms-visibility: internal
        - name: searchParams
          in: query
          required: false
          description: Search params URL encoded JSON object.
          # Refer '#/definitions/ContactSearchParams' for allowed values
          type: string
          x-ms-visibility: advanced
        - name: sortKey
          in: query
          required: false
          description: The field to sort the results by. Allowed values are creationDate, lastModifiedDate. If not passed, will default to creationDate
          type: string
          x-ms-visibility: advanced
        - name: sortOrder
          in: query
          required: false
          description: Whether to sort ascending or descencding. Allowed values are asc and desc. Default is desc
          type: string
          x-ms-visibility: advanced
        - name: count
          in: query
          type: number
          description: Count of records to return. Default is 25. Max is 100
          required: false
          x-ms-visibility: advanced
        - name: offset
          in: query
          type: number
          description: Number of records to skip from the beginning. Default is 0
          required: false
          x-ms-visibility: advanced
      tags:
        - Search for contacts
      responses:
        200:

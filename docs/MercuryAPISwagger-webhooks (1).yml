swagger: '2.0'
info:
 title: Mercury Public API (Sandbox)
 description: Public API for Mercury (Sandbox)
 version: "1.2.3"
 contact:
  name: Connective
  url: http://www.connective.com.au
  email: helpdesk@connective.com.au
# the domain of the service
host: apis.connective.com.au
schemes:
  - https
# will be prefixed to all paths
basePath: /mercury/v1
consumes:
  - application/json
produces:
  - application/json
paths:
  /{token}/opportunities:
    get:
      summary: Search for opportunities
      description: |
       Search for opportunities based on various criteria. If no optional query params are passed, it will return the 25 most recently created records in descending order
      operationId: Opportunity-search
      parameters:
        - name: token
          in: path
          description: User security token
          x-ms-summary: User security token
          required: true
          type: string
          x-ms-visibility: internal
        - name: x-api-key
          in: header
          description: API key for the broker group
          x-ms-summary: API key
          required: true
          type: string
        - name: search
          in: query
          required: true
          description: |
                     Marker param to let the system know a search is being requested. The param name can be passed by itself.
                     eg. both /opportunities?search and /opportunities?search=true will have the same effect
          type: string
          default: true
          x-ms-visibility: internal
        - name: searchParams
          in: query
          required: false
          description: URL encoded search params JSON object
          # Refer #/definitions/OpportunitySearchParams for allowed values
          type: string
          x-ms-visibility: advanced
        - name: sortKey
          in: query
          required: false
          x-ms-summary: Sort key
          description: |
                      The field to sort the results by. Allowed values are creationDate, lastModifiedDate. If not passed, will default to creationDate
          type: string
        - name: sortOrder
          in: query
          required: false
          x-ms-summary: Sort order
          description: Whether to sort ascending or descencding. Allowed values are asc and desc. Default is desc
          type: string
          x-ms-visibility: advanced
        - name: count
          in: query
          type: number
          description: Count of records to return. Default is 25. Max is 100
          required: false
          x-ms-summary: Count
          x-ms-visibility: advanced
        - name: offset
          in: query
          type: number
          description: Number of records to skip from the beginning. Default is 0
          required: false
          x-ms-summary: Offset
          x-ms-visibility: advanced
      tags:
        - Search for opportunities
      responses:
        200:
          description: Search Results object
          schema:
            $ref: '#/definitions/OpportunitySearchResult'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        404:
          description: Not found
          schema:
            $ref: '#/definitions/Error'
        500:
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'
    post:
      summary: Create a new opportunity
      description: |
       Creates a new opportunity and returns its uniqueId and emailId if the request is successful.
       If a uniqueId is provided in the request body, it will be ignored
      operationId: Opportunity-create
      x-ms-visibility: important
      parameters:
        - name: token
          in: path
          description: User security token
          x-ms-summary: User security token
          required: true
          type: string
          x-ms-visibility: internal
        - name: x-api-key
          in: header
          required: true
          description: API key for the broker group
          x-ms-summary: API key
          type: string
        - name: body
          in: body
          required: true
          schema:
           $ref: '#/definitions/Opportunity'
      tags:
        - Create a new opportunity
      responses:
        200:
          description: Success response
          schema:
            $ref: '#/definitions/Success'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        403:
          description: Forbidden
          schema:
            $ref: '#/definitions/Error'
        404:
          description: Not found
          schema:
            $ref: '#/definitions/Error'
        500:
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'
  /{token}/opportunities/{id}:

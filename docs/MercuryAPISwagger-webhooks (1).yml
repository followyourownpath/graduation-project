     type: string
     description: key of the configuration
     x-ms-summary: configuration key
     maxLength: 45
    value:
     type: string
     description: value
     x-ms-summary: value
     maxLength: 225
    primaryBg:
     type: string
     description: primary background colour
     x-ms-summary: primary background
     maxLength: 10
    secondaryBg:
     type: string
     description: secondary background colour
     x-ms-summary: secondary background
     maxLength: 10
    defaultBg:
     type: string
     description: default background colour
     x-ms-summary: default background
     maxLength: 10
    primaryFont:
     type: string
     description: primary foreground colour
     x-ms-summary: primary foreground
     maxLength: 10
    secondaryFont:
     type: string
     description: secondary foreground colour
     x-ms-summary: secondary foreground
     maxLength: 10
    defaultFont:
     type: string
     description: default foreground colour
     x-ms-summary: default foreground
     maxLength: 10
    vbInherit:
     type: integer
     format: int32
     description: is virtual branch
  Contact:
   type: object
   description: The details of the contact
   properties:
    uniqueId:
     type: string
     format: uuid
     description: Unique id of the contact
     x-ms-summary: Contact id
     maxLength: 44
    company:
     type: string
     description: Partner id to which this contact belongs
     x-ms-summary: Partner id
     maxLength: 36
    isDeleted:
     type: boolean
     description: Whether contact has been marked as deleted
     x-ms-summary: Deleted contact
    deletedBy:
     type: string
     description: User who deleted the contact
     x-ms-summary: Contact deleted by
     maxLength: 64
    deletedOn:
     type: string
     format: date-time
     description: Date contact was deleted
     x-ms-summary: Contact deletion date
    createdOn:
     type: string
     format: date-time
     description: Date contact was created
     x-ms-summary: Contact creation date
    createdBy:
     type: string
     description: User who created the contact
     x-ms-summary: Contact created by
     maxLength: 45
    firstName:
     type: string
     description: First name
     x-ms-summary: First name
     maxLength: 64
    lastName:
     type: string
     description: Last name

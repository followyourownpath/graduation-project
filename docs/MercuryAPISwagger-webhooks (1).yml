        500:
          description: Internal server error
          schema:
            $ref: '#/definitions/Error'
    put:
      summary: Update an opportunity
      description: |
        Update the parent opportunity entity
      operationId: Opportunity-update
      x-ms-visibility: important
      parameters:
        - name: token
          in: path
          description: User security token
          x-ms-summary: User security token
          required: true
          type: string
          x-ms-visibility: internal
        - name: x-api-key
          in: header
          required: true
          type: string
          description: API key for the broker group
          x-ms-summary: API key
        - name: id
          in: path
          description: Unique id of the opportunity to update
          x-ms-summary: Unique id of the opportunity to update
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
           $ref: '#/definitions/Opportunity'
      tags:
        - Update an opportunity
      responses:
        200:
          description: The success response
          schema:
            $ref: '#/definitions/Success'
        400:
          description: Bad request
          schema:
            $ref: '#/definitions/Error'
        401:
          description: Unauthorized
          schema:
            $ref: '#/definitions/Error'
        403:
          description: Forbidden
          schema:

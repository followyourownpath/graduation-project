name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Test backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          python -m compileall .
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Validate production Compose configuration
        env:
          APP_ENV_FILE: deploy/production.env.example
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: validation-placeholder
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aimeshlabs.au/bread
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Deploy main on VPS
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /home/interndev/bread
            git config remote.origin.fetch "+refs/heads/main:refs/remotes/origin/main"
            git fetch --prune origin
            git checkout -B main origin/main
            ./deploy/deploy.sh
          '

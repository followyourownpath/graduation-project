name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fail if tracked .env files
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Tracked .env files must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked .env files"

      - name: Fail if private keys or credential files are tracked
        run: |
          set -euo pipefail
          tracked="$(git ls-files | grep -Ei '(^|/)(id_rsa|id_ed25519|.*\.(pem|p12|pfx)|credentials\.json|serviceAccountKey\.json)$' || true)"
          if [ -n "$tracked" ]; then
            echo "::error::Credential/private-key files must not be committed:"
            echo "$tracked"
            exit 1
          fi
          echo "No tracked credential files"

      - name: Scan committed files for high-risk secret values
        run: |
          set -euo pipefail
          # Only scan text-ish tracked files; skip binaries, lockfiles, and example env templates.
          files="$(git ls-files \
            ':!:*.png' ':!:*.jpg' ':!:*.jpeg' ':!:*.gif' ':!:*.webp' ':!:*.pdf' \
            ':!:*.lock' ':!:package-lock.json' ':!:**/.env.example' ':!:**/*.example')"

          # Non-empty assignment of common secret env vars, or long JWT-looking blobs.
          if echo "$files" | xargs grep -nE \
            -e '(SUPABASE_(SECRET|SERVICE_ROLE)_KEY|AZURE_DOCUMENT_INTELLIGENCE_KEY|AWS_SECRET_ACCESS_KEY|OPENAI_API_KEY)\s*=\s*["'\'']?[A-Za-z0-9._-]{16,}' \
            -e 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' \
            -- 2>/dev/null; then
            echo "::error::Possible secret values found in tracked files. Remove them and rotate credentials."
            exit 1
          fi
          echo "No high-risk secret patterns found"
